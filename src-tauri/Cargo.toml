[package]
name = "free-grind"
version = "0.5.3"
description = "GrindFlop is a Grindr Client"
# This fork, then the original Free Grind author, whose credit the licence asks to keep.
authors = ["Jay Brammeld <jay@imaoreo.dev>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_grind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# This feature is used for production builds to enable custom protocol support (tauri://).
# It's automatically enabled by the Tauri CLI during "tauri build".
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# custom-protocol is removed from here and moved to [features].
# In the previous definition, it was active even in dev mode, which caused
# the app to load cached or embedded assets instead of connecting to the
# dev server, preventing hot-reloading and updates on mobile/emulators.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "10.3.0"
rand = "0.10.1"
chrono = "0.4.44"
tauri-plugin-fs = "2"
keyring-core = "0.7.2"
rmp-serde = "1.3.1"
serde_bytes = "0.11"
tauri-plugin-geolocation = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = { path = "notification-patched" }
tauri-plugin-http = "2"
futures-util = "0.3"
http = "1"
url = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
wreq = { version = "5.3", features = ["gzip", "json"] }
# Independent HTTP client for version fetching and Google Drive; Grindr traffic still uses wreq.
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls", "stream"], default-features = false }
rustls = { version = "0.23", features = ["ring"] }
ring = "0.17"
base64 = "0.22"
zeroize = "1"
# On-device photo detector (commands/vision.rs): pure Rust, so it builds the same on every platform.
tract-onnx = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# Platform-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "0.5.1"
# Use rustls for WebSocket on Windows to avoid SChannel JA3 fingerprint detection by Cloudflare
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Same webview2-com/windows versions wry (our Tauri version's webview backend) already
# pulls in, so the ICoreWebView2 types in lib.rs line up with what's actually loaded.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Security", "Win32_System_Registry"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "0.5.0"
tauri-plugin-android-fs = { version = "=28.2.2", features = ["legacy_storage_permission"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-photos = "0.3"
tauri-plugin-ios-keyboard-fix = { path = "ios-keyboard-fix" }
tauri-plugin-ios-google-oauth = { path = "ios-google-oauth" }
apple-native-keyring-store = { version = "0.2.3", features = ["protected"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "0.2.3", features = ["protected", "keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "0.2.1"
webkit2gtk = "2"

# The photo detector is unusably slow unoptimised, so the crates that do its
# arithmetic are optimised in dev builds too.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
