# A private repository bills Actions minutes, and the multipliers are brutal:
# Windows counts double and macOS counts ten times over. A push that built both
# cost about 50 of the 2,000 minutes a free account gets each month, so roughly
# 40 builds. Pushing now builds Windows alone, about 10 minutes; the iOS build
# is run by hand when there is something to try on the phone:
#
#   gh workflow run "Build Test Artifacts (iOS on demand)" --repo <owner>/<repo> #     --ref upstream-integrated-features -f ios=true -f windows=false
#
# or Actions > Build Test Artifacts > Run workflow in the browser.
name: Build Test Artifacts (iOS on demand)

on:
  push:
    branches:
      - upstream-integrated-features
  workflow_dispatch:
    inputs:
      windows:
        description: Build the Windows app
        type: boolean
        default: true
      ios:
        description: Build the iOS app (ten times the billed minutes)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-windows:
    # Every push, and a manual run that asks for it.
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    permissions:
      contents: write # the windows-latest release below
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate Windows Google OAuth client credentials
        shell: pwsh
        env:
          FREE_GRIND_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.FREE_GRIND_GOOGLE_DESKTOP_CLIENT_ID }}
          FREE_GRIND_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.FREE_GRIND_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if ($env:FREE_GRIND_GOOGLE_DESKTOP_CLIENT_ID -notmatch '^[^.]+\.apps\.googleusercontent\.com$') {
            throw 'FREE_GRIND_GOOGLE_DESKTOP_CLIENT_ID must be configured for a Drive-capable Windows build'
          }
          if ($env:FREE_GRIND_GOOGLE_DESKTOP_CLIENT_SECRET -notmatch '^[\x21-\x7e]{1,512}$') {
            throw 'FREE_GRIND_GOOGLE_DESKTOP_CLIENT_SECRET must be configured for a Drive-capable Windows build'
          }

      - name: Build Windows artifacts
        env:
          FREE_GRIND_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.FREE_GRIND_GOOGLE_DESKTOP_CLIENT_ID }}
          FREE_GRIND_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.FREE_GRIND_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: bunx tauri build

      # Artifacts share one storage quota per account, and once it is full every
      # upload fails until GitHub recounts it, 6 to 12 hours later. Release
      # files are not counted against it, so the app also goes to a single
      # pre-release that each build overwrites. Its notes name the commit.
      - name: Publish the Windows app to the windows-latest release
        # The public build copy keeps its apps as artifacts only: a release
        # there would let anyone download them.
        if: github.repository == 'dm2mymcszt-commits/free-grind'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = @("src-tauri/target/release/GrindFlop.exe", "src-tauri/target/release/free-grind.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "No Windows executable was built" }
          $notes = "Built from $env:GITHUB_SHA on $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC. Each build replaces it."
          gh release view windows-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title "Latest Windows build" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create the release" }
          } else {
            gh release edit windows-latest --repo $env:GITHUB_REPOSITORY --notes $notes
          }
          gh release upload windows-latest $exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the app" }

      - name: Upload Windows artifacts
        # The release above is what delivers the app; a full quota here must
        # not turn a good build red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: free-grind-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/GrindFlop.exe
            src-tauri/target/release/free-grind.exe
          if-no-files-found: error
          # The default is 90 days. 238 builds piled up in a month and filled
          # the account's artifact storage, which made every upload fail.
          # 1 day: the public build copy hands these to any signed-in GitHub
          # user, and the Windows app carries the Google keys. Each one is
          # deleted as soon as it has been sent; this is only the fallback.
          retention-days: 1

  build-ios:
    # By hand only — see the note at the top of this file.
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    permissions:
      contents: write # the ios-latest release below
    env:
      FREE_GRIND_GOOGLE_IOS_CLIENT_ID: ${{ secrets.FREE_GRIND_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate iOS Google OAuth client ID
        run: |
          if [ -z "$FREE_GRIND_GOOGLE_IOS_CLIENT_ID" ]; then
            echo "FREE_GRIND_GOOGLE_IOS_CLIENT_ID must be configured for a Drive-capable iOS build"
            exit 1
          fi

      - name: Test native background report serialization
        run: bun test tests/iosBackgroundState.test.ts tests/backgroundExecution.test.ts

      - name: Build frontend assets
        run: bun run build

      - name: Initialize iOS project
        run: |
          rm -rf src-tauri/gen/apple
          bunx tauri ios init --ci

      - name: Apply launch screen
        run: sh scripts/apply-ios-launch-screen.sh

      - name: Configure iOS authentication framework
        run: |
          sh scripts/configure-ios-google-oauth.sh \
            --project-yml src-tauri/gen/apple/project.yml
          xcodegen generate --spec src-tauri/gen/apple/project.yml

      - name: Merge app Info.plist
        run: |
          # tauri ios init/xcodegen generates its own Info.plist and does not pull in
          # src-tauri/Info.plist, which holds every NS*UsageDescription key. iOS kills the
          # app outright the moment it requests location/photos/camera/mic without them,
          # so merge ours over the generated one before building.
          GEN_PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -n 1)
          if [ -z "$GEN_PLIST" ]; then
            echo "Generated Info.plist not found under src-tauri/gen/apple"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Merge src-tauri/Info.plist" "$GEN_PLIST"
          sh scripts/configure-ios-google-oauth.sh --info-plist "$GEN_PLIST"
          plutil -lint "$GEN_PLIST"

          if ! grep -q NSCameraUsageDescription "$GEN_PLIST"; then
            echo "Info.plist merge did not take effect"
            exit 1
          fi
          # Keep Running in Background plays a silent sound; without this mode
          # iOS suspends the app anyway.
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$GEN_PLIST" | grep -q audio; then
            echo "Info.plist has no audio background mode"
            exit 1
          fi
          # Chat notifications carry the sender's photo as a message intent.
          if ! /usr/libexec/PlistBuddy -c "Print :NSUserActivityTypes" "$GEN_PLIST" | grep -q INSendMessageIntent; then
            echo "Info.plist does not declare the message intent"
            exit 1
          fi

          echo "Merged src-tauri/Info.plist into $GEN_PLIST"

      - name: Build iOS Rust static library
        run: |
          # custom-protocol must be on: tauri-build derives cfg(dev) from its absence, and a
          # dev-cfg build loads the frontend from the vite devUrl instead of the bundled
          # assets, which is a blank screen on a real device.
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release --features custom-protocol

          LIB_PATH="src-tauri/target/aarch64-apple-ios/release/libopen_grind_lib.a"
          if [ ! -f "$LIB_PATH" ]; then
            echo "iOS static library not found at $LIB_PATH"
            exit 1
          fi

          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp "$LIB_PATH" src-tauri/gen/apple/Externals/arm64/release/libapp.a

          mkdir -p src-tauri/gen/apple/Externals/x86_64/release
          cp "$LIB_PATH" src-tauri/gen/apple/Externals/x86_64/release/libapp.a

      - name: Disable Xcode Rust bridge script
        run: |
          PBXPROJ_PATH=$(find src-tauri/gen/apple -maxdepth 3 -name project.pbxproj | head -n 1)
          if [ -z "$PBXPROJ_PATH" ]; then
            echo "project.pbxproj not found under src-tauri/gen/apple"
            exit 1
          fi

          tmp_file="$(mktemp)"
          if ! awk '
            BEGIN { replaced = 0 }
            /tauri ios xcode-script/ {
              print "\t\t\tshellScript = \"set -e\\nLIB_PATH=\\\"$SRCROOT/Externals/arm64/release/libapp.a\\\"\\nif [ ! -f \\\"$LIB_PATH\\\" ]; then\\n  echo \\\"Missing prebuilt Rust library at $LIB_PATH\\\"\\n  exit 1\\nfi\";"
              replaced = 1
              next
            }
            { print }
            END {
              if (replaced == 0) {
                exit 2
              }
            }
          ' "$PBXPROJ_PATH" > "$tmp_file"; then
            rm -f "$tmp_file"
            echo "Failed to replace Build Rust Code script"
            exit 1
          fi

          mv "$tmp_file" "$PBXPROJ_PATH"

          if ! grep -q -- 'Missing prebuilt Rust library' "$PBXPROJ_PATH"; then
            echo "Failed to replace Build Rust Code script"
            exit 1
          fi

          if ! plutil -lint "$PBXPROJ_PATH" >/dev/null; then
            echo "Patched project.pbxproj is invalid"
            exit 1
          fi

          echo "Patched Build Rust Code script to use prebuilt libapp.a"

      - name: Build iOS app without code signing
        id: ios_app
        env:
          TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
        run: |
          IOS_PROJECT_DIR="src-tauri/gen/apple"
          WORKSPACE_PATH=$(find "$IOS_PROJECT_DIR" -maxdepth 2 -name '*.xcworkspace' | head -n 1)
          XCODEPROJ_PATH=$(find "$IOS_PROJECT_DIR" -maxdepth 2 -name '*.xcodeproj' | head -n 1)

          if [ -n "$WORKSPACE_PATH" ]; then
            PROJECT_ARGS=(-workspace "$WORKSPACE_PATH")
          elif [ -n "$XCODEPROJ_PATH" ]; then
            PROJECT_ARGS=(-project "$XCODEPROJ_PATH")
          else
            echo "No Xcode workspace/project found under $IOS_PROJECT_DIR"
            exit 1
          fi

          SCHEME=$(xcodebuild "${PROJECT_ARGS[@]}" -list \
            | awk '/Schemes:/ {flag=1; next} flag && NF {gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print}')

          IOS_SCHEME=$(printf '%s\n' "$SCHEME" | grep -Ei '(^|_|-)ios$|_iOS$|iOS' | head -n 1 || true)
          if [ -n "$IOS_SCHEME" ]; then
            SCHEME="$IOS_SCHEME"
          else
            SCHEME=$(printf '%s\n' "$SCHEME" | head -n 1)
          fi

          if [ -z "$SCHEME" ]; then
            echo "Failed to resolve iOS scheme"
            exit 1
          fi

          echo "Using iOS scheme: $SCHEME"

          DERIVED_DATA_PATH="$RUNNER_TEMP/ios-derived"
          xcodebuild "${PROJECT_ARGS[@]}" \
            -scheme "$SCHEME" \
            -configuration release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

          APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 2 -type d -name '*.app' | grep -E '/(release|Release)-iphoneos/' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No release .app artifact found in $DERIVED_DATA_PATH/Build/Products"
            exit 1
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Check the decoy icons made it into the app
        run: |
          # Settings > Privacy > App Disguise. Optional, so this only warns:
          # without the icons the app still works and says the icon could
          # not be changed.
          APP_PATH='${{ steps.ios_app.outputs.app_path }}'
          missing=0
          for name in Calculator Notes Weather; do
            for suffix in '@2x' '@3x'; do
              if [ ! -f "$APP_PATH/Disguise$name$suffix.png" ]; then
                echo "::warning::Decoy icon Disguise$name$suffix.png is not in the app bundle"
                missing=1
              fi
            done
          done
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons:Calculator" "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "::warning::The built Info.plist does not list the decoy icons (CFBundleAlternateIcons)"
            missing=1
          fi
          if [ "$missing" = 0 ]; then
            echo "Decoy icons are in the bundle and listed in Info.plist"
          fi

      - name: Embed and verify TrollStore background entitlement
        run: sh scripts/sign-ios-trollstore.sh '${{ steps.ios_app.outputs.app_path }}'

      - name: Package TrollStore IPA
        id: ios_ipa
        run: |
          APP_PATH='${{ steps.ios_app.outputs.app_path }}'
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Cannot package IPA; app bundle missing at $APP_PATH"
            exit 1
          fi

          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          IPA_PATH="$RUNNER_TEMP/free-grind-unsigned.ipa"

          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      # Same reason as the Windows job's windows-latest release: a full
      # artifact quota made the build of f03d7b70 (2026-10-15) compile and
      # then lose its IPA at the upload, at ten times the billed minutes.
      - name: Publish the IPA to the ios-latest release
        # The public build copy keeps its apps as artifacts only: a release
        # there would let anyone download them.
        if: github.repository == 'dm2mymcszt-commits/free-grind'
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.ios_ipa.outputs.ipa_path }}
        run: |
          notes="Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M') UTC. Each build replaces it."
          if gh release view ios-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit ios-latest --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create ios-latest --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Latest iOS build" --notes "$notes"
          fi
          gh release upload ios-latest "$IPA_PATH" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload IPA Artifact
        # The release above is what delivers the IPA.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: free-grind-unsigned-ipa
          path: ${{ steps.ios_ipa.outputs.ipa_path }}
          if-no-files-found: error
          # 1 day: the public build copy hands these to any signed-in GitHub
          # user, and the Windows app carries the Google keys. Each one is
          # deleted as soon as it has been sent; this is only the fallback.
          retention-days: 1
